substitutions:
  radio_channel: "7"

esphome:
  name: espnow-light

esp8266:
  board: esp01_1m

external_components:
  - source:
      type: local
      path: ../components
    components: [esp_now_light]

espnow:
  id: radio
  channel: ${radio_channel}

logger:
  baud_rate: 0

esp_now_light:
  espnow_id: radio
  receivers:
    - light_id: garden_light
      light_type: rgb
      light_number: 1

light:
  - platform: neopixelbus
    variant: WS2812
    pin: GPIO3
    num_leds: 16
    type: GRB
    id: garden_light
    effects:
      - addressable_rainbow:
          name: "Addressable 1 (Rainbow)"
          speed: 5
      - addressable_color_wipe:
          name: "Addressable 2 (Color Wipe)"
          add_led_interval: 300ms
      - addressable_scan:
          name: "Addressable 3 (Scan)"
          move_interval: 50ms
      - addressable_twinkle:
          name: "Addressable 4 (Twinkle)"
          progress_interval: 20ms
          twinkle_probability: 3%
      - addressable_random_twinkle:
          name: "Addressable 5 (Random Twinkle)"
          progress_interval: 50ms
          twinkle_probability: 20%
      - addressable_fireworks:
          name: "Addressable 6 (Fireworks)"
          fade_out_rate: 160
      - addressable_fireworks:
          name: "Addressable 7 (Random Fireworks)"
          use_random_color: true
          spark_probability: 15%
      - random: 
          name: "Fade"
          transition_length: 3s
          update_interval: 10s
      - strobe:
          name: "Strobe"
          colors:
            - state: true
              duration: 150ms
            - state: false
              duration: 150ms
      - strobe:
          name: "Strobe (RGB)"
          colors:
            - state: true
              red: 100%
              green: 0%
              blue: 0%
              duration: 100ms
            - state: true
              red: 0%
              green: 100%
              blue: 0%
              duration: 100ms
            - state: true
              red: 0%
              green: 0%
              blue: 100%
              duration: 100ms
            - state: false
              duration: 100ms
