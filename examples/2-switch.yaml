substitutions:
  wifi_ssid: "Your Wi-Fi SSID"
  wifi_password: "your-wifi-password"
  light_address_1: "02:00:00:00:00:01"

esphome:
  name: espnow-switch

esp8266:
  board: d1_mini

external_components:
  - source:
      type: local
      path: ../components
    components: [esp_now_light]

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

api:

ota:
  - platform: esphome

logger:

espnow:
  id: radio

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "Switch"
    on_press:
      light.toggle: light_1

light:
  - platform: esp_now_light
    id: light_1
    light_type: rgb
    mac_address: ${light_address_1}
    light_number: 1
    espnow_id: radio
    effects:
      - automation:
          name: "Addressable 1 (Rainbow)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 2 (Color Wipe)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 3 (Scan)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 4 (Twinkle)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 5 (Random Twinkle)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 6 (Fireworks)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 7 (Random Fireworks)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Fade"
          sequence:
            - delay: 0ms
      - automation:
          name: "Strobe"
          sequence:
            - delay: 0ms
      - automation:
          name: "Strobe (RGB)"
          sequence:
            - delay: 0ms
