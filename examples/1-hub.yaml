substitutions:
  wifi_ssid: "Your Wi-Fi SSID"
  wifi_password: "your-wifi-password"
  light_address_1: "02:00:00:00:00:01"
  light_address_2: "02:00:00:00:00:02"

esphome:
  name: espnow-hub

esp8266:
  board: d1_mini

external_components:
  - source:
      type: local
      path: ../components
    components: [esp_now_light]

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

api:

ota:
  - platform: esphome

logger:

espnow:
  id: radio

power_supply:
  - id: light_power
    pin:
      number: GPIO4
      inverted: true
    enable_time: 2s
    keep_on_time: 10s

light:
  - platform: esp_now_light
    name: "Garden Light 1"
    light_type: rgb
    mac_address: ${light_address_1}
    light_number: 1
    espnow_id: radio
    power_supply: light_power
    effects:
      - automation:
          name: "Addressable 1 (Rainbow)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 2 (Color Wipe)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 3 (Scan)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 4 (Twinkle)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 5 (Random Twinkle)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 6 (Fireworks)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 7 (Random Fireworks)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Fade"
          sequence:
            - delay: 0ms
      - automation:
          name: "Strobe"
          sequence:
            - delay: 0ms
      - automation:
          name: "Strobe (RGB)"
          sequence:
            - delay: 0ms
  - platform: esp_now_light
    name: "Garden Light 2"
    light_type: rgb
    mac_address: ${light_address_2}
    light_number: 1
    espnow_id: radio
    power_supply: light_power
    effects:
      - automation:
          name: "Addressable 1 (Rainbow)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 2 (Color Wipe)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 3 (Scan)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 4 (Twinkle)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 5 (Random Twinkle)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 6 (Fireworks)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 7 (Random Fireworks)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Fade"
          sequence:
            - delay: 0ms
      - automation:
          name: "Strobe"
          sequence:
            - delay: 0ms
      - automation:
          name: "Strobe (RGB)"
          sequence:
            - delay: 0ms
