substitutions:
  wifi_ssid: "Your Wi-Fi SSID"
  wifi_password: "your-wifi-password"
  light_address_1: "02:00:00:00:00:01"
  light_address_2: "02:00:00:00:00:02"

esphome:
  name: espnow-hub-serial

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [esp_now_light]

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

api:

ota:
  - platform: esphome

logger:
  baud_rate: 0

uart:
  id: relay_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

power_supply:
  - id: light_power
    pin: GPIO4
    enable_time: 2s
    keep_on_time: 10s

light:
  - platform: esp_now_light
    name: "Garden Light 1"
    light_type: rgb
    mac_address: ${light_address_1}
    light_number: 1
    uart_id: relay_uart
    power_supply: light_power
    effects:
      - automation:
          name: "Addressable 1 (Rainbow)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 2 (Color Wipe)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 3 (Scan)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 4 (Twinkle)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 5 (Random Twinkle)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 6 (Fireworks)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 7 (Random Fireworks)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Fade"
          sequence:
            - delay: 0ms
      - automation:
          name: "Strobe"
          sequence:
            - delay: 0ms
      - automation:
          name: "Strobe (RGB)"
          sequence:
            - delay: 0ms
  - platform: esp_now_light
    name: "Garden Light 2"
    light_type: rgb
    mac_address: ${light_address_2}
    light_number: 1
    uart_id: relay_uart
    power_supply: light_power
    effects:
      - automation:
          name: "Addressable 1 (Rainbow)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 2 (Color Wipe)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 3 (Scan)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 4 (Twinkle)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 5 (Random Twinkle)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 6 (Fireworks)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Addressable 7 (Random Fireworks)"
          sequence:
            - delay: 0ms
      - automation:
          name: "Fade"
          sequence:
            - delay: 0ms
      - automation:
          name: "Strobe"
          sequence:
            - delay: 0ms
      - automation:
          name: "Strobe (RGB)"
          sequence:
            - delay: 0ms

sensor:
  - platform: esp_now_light
    uart_id: relay_uart
    name: "ESP-NOW failed transmissions"
